[project]
name = "netflix-viewing-history"
version = "0.1.0"
description = "Export the viewing activity of every profile on your own Netflix account"
requires-python = ">=3.10"
dependencies = ["playwright>=1.40", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
netflix-history = "netflix_history.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["netflix_history"]
